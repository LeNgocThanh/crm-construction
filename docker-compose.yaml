services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-construction-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5555}:5555"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 5555
      HOSTNAME: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5555/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  app_uploads:
